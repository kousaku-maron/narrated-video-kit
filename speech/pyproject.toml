[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narrated-video-kit-speech"
version = "0.1.0"
description = "Local Japanese narration generator for narrated videos"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
indie-narration = "indie_narration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
