<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>インディーゲーム体験レビュー｜サムネイル原稿</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; }
    body { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }

    /* これは初期値。背景画と作品の色に合わせて毎回決め直す。 */
    :root {
      --chip-bg: #087f9d;
      --chip-text: #fff;
      --hook-color: #ff4f4a;
      --route-color: #18c7db;
      --glow-color: #d5786033;
      --art-saturation: 1;
      --art-contrast: 1;
      --lead-size: 90px;
      --hook-size: 160px;
      --footer-size: 48px;
    }

    .canvas { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #102b42; isolation: isolate; }
    .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(var(--art-saturation)) contrast(var(--art-contrast)); }
    .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #07142158 0%, #07142124 38%, transparent 70%), linear-gradient(0deg, #071421fa 0%, #071421e3 14%, #07142194 31%, transparent 60%); }
    .glow { position: absolute; left: -140px; bottom: -270px; width: 850px; height: 450px; border-radius: 50%; background: radial-gradient(ellipse, var(--glow-color), transparent 65%); filter: blur(12px); }
    .badge { position: absolute; top: 38px; left: 44px; padding: 15px 22px 17px; background: var(--chip-bg); color: var(--chip-text); border-radius: 9px; box-shadow: 0 12px 28px #0714216e, inset 0 1px #ffffff35; font-size: 30px; font-weight: 900; line-height: 1; letter-spacing: .02em; text-shadow: 0 2px 4px #06334088; }
    .copy { position: absolute; left: 45px; bottom: 102px; }
    .lead { display: block; color: #f7f8f5; font-size: var(--lead-size); font-weight: 900; letter-spacing: -4px; line-height: 1; -webkit-text-stroke: 3px #091924; paint-order: stroke fill; text-shadow: 0 8px 20px #000b; }
    .hook { display: block; width: fit-content; margin-top: -4px; color: var(--hook-color); font-size: var(--hook-size); font-weight: 900; letter-spacing: -7px; line-height: .98; -webkit-text-stroke: 3px #261b22; paint-order: stroke fill; text-shadow: 0 8px 18px #000b; }
    .footer { position: absolute; left: 47px; bottom: 30px; display: flex; align-items: center; gap: 16px; color: #e9f0ef; font-size: var(--footer-size); font-weight: 900; letter-spacing: .015em; text-shadow: 0 4px 12px #000d; }
    .route { position: relative; width: 64px; height: 2px; background: linear-gradient(90deg, var(--route-color), transparent); box-shadow: 0 0 10px #0006; }
    .route::before { content: ""; position: absolute; left: -1px; top: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--route-color); box-shadow: 0 0 0 4px #ffffff24; }
    .logo { position: absolute; right: 30px; top: 30px; width: 470px; height: 250px; object-fit: contain; object-position: right top; filter: drop-shadow(0 5px 10px #0008); }
    .avatar-ring { position: absolute; right: 30px; bottom: 22px; width: 187px; height: 187px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #437181ba, #102738f0 75%); border: 2px solid #e7f2f0a6; box-shadow: 0 12px 29px #0009, 0 0 0 6px #0c263984; }
    .avatar { position: absolute; right: 25px; bottom: -16px; width: 199px; height: 218px; object-fit: contain; object-position: bottom right; filter: drop-shadow(0 7px 10px #0009); }
  </style>
</head>
<body>
  <div class="canvas">
    <img class="art" src="../assets/images/thumbnail-bg.jpg" alt="">
    <div class="shade"></div>
    <div class="glow"></div>
    <div class="badge">体験版レビュー</div>
    <div class="copy"><span class="lead">短い前段</span><span class="hook">強調句</span></div>
    <div class="footer"><span class="route"></span><span>体験の根拠を一言で</span></div>
    <!-- 背景画像にロゴが入っていない場合だけ使う。 -->
    <!-- <img class="logo" src="../assets/images/thumbnail-logo.png" alt=""> -->
    <div class="avatar-ring"></div>
    <img class="avatar" src="../assets/images/thumbnail-avatar.png" alt="">
  </div>
</body>
</html>
